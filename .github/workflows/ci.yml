name: Core and DSH source pair

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-pair-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: release/legion-service/requirements-core.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.9.0"
          cache: npm
          cache-dependency-path: connectors/dsh-plugin-legion/package-lock.json
      - name: Install declared test dependencies, serially
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/legion-pair/logs"
          python -m pip install -r release/legion-service/requirements-core.txt pytest \
            2>&1 | tee "$RUNNER_TEMP/legion-pair/logs/python-dependencies.txt"
          npm ci --prefix connectors/dsh-plugin-legion \
            2>&1 | tee "$RUNNER_TEMP/legion-pair/logs/connector-dependencies.txt"
      - name: Core isolated unit and protocol tests
        env:
          MEYO_LEGION_DIR: ${{ runner.temp }}/core-tests/meyo
          LEGION_HOME_DIR: ${{ runner.temp }}/core-tests/legion
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -o pipefail
          export PATH="$GITHUB_WORKSPACE/connectors/dsh-plugin-legion/node_modules/.bin:$PATH"
          python -m pytest -q -ra release/legion-service/tests \
            2>&1 | tee "$RUNNER_TEMP/legion-pair/logs/core-tests.txt"
      - name: DSH checks and original tests, with the real core packager
        working-directory: connectors/dsh-plugin-legion
        run: |
          set -o pipefail
          npm run check
          LEGION_CORE_PACKAGER="$GITHUB_WORKSPACE/scripts/package_core.py" \
            node --test --test-concurrency=1 test/*.test.js \
            2>&1 | tee "$RUNNER_TEMP/legion-pair/logs/connector-tests.txt"
      - name: Export the unchanged DSH package root with Git subtree
        run: |
          set -euo pipefail
          split="$(git subtree split --prefix=connectors/dsh-plugin-legion "$GITHUB_SHA")"
          git init "$RUNNER_TEMP/legion-connector"
          git -C "$RUNNER_TEMP/legion-connector" fetch --no-tags "$GITHUB_WORKSPACE" "$split"
          git -C "$RUNNER_TEMP/legion-connector" checkout --detach FETCH_HEAD
          test "$(git rev-parse "${GITHUB_SHA}:connectors/dsh-plugin-legion")" = \
            "$(git -C "$RUNNER_TEMP/legion-connector" rev-parse "HEAD^{tree}")"
          printf '%s\n' "$split" > "$RUNNER_TEMP/legion-pair/connector-commit.txt"
      - name: Package and pair the exact two source identities
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/legion-pair"
          connector="$RUNNER_TEMP/legion-connector"
          python -I -B scripts/package_core.py build \
            --repo "$GITHUB_WORKSPACE" --commit "$GITHUB_SHA" --output "$out/core.tar" \
            --distribution public-source --license-id MIT \
            --license-file LICENSE --notice-file THIRD_PARTY_NOTICES.md
          (cd "$connector" && npm pack --json --ignore-scripts --offline \
            --pack-destination "$out") > "$out/npm-pack.json"
          archive="$out/$(node -e \
            'console.log(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))[0].filename)' \
            "$out/npm-pack.json")"
          connector_sha="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          printf '%s\n' "$connector_sha" > "$archive.sha256"
          python -I -B connectors/dsh-plugin-legion/scripts/release_pair.py \
            --core-packager "$GITHUB_WORKSPACE/scripts/package_core.py" \
            --core-repo "$GITHUB_WORKSPACE" --core-commit "$GITHUB_SHA" \
            --core-archive "$out/core.tar" --core-sha256 "$(cat "$out/core.tar.sha256")" \
            --connector-repo "$connector" --connector-commit "$(cat "$out/connector-commit.txt")" \
            --connector-source-path connectors/dsh-plugin-legion \
            --connector-archive "$archive" --connector-sha256 "$connector_sha" \
            --connector-pack-report "$out/npm-pack.json" --output "$out/pair.prepared.json"
      - name: Native compatibility and download fixture bound to this pair
        working-directory: connectors/dsh-plugin-legion
        run: |
          set -o pipefail
          LEGION_RELEASE_PAIR_FILE="$RUNNER_TEMP/legion-pair/pair.prepared.json" \
          LEGION_RELEASE_PAIR_RECEIPT="$RUNNER_TEMP/legion-pair/native-offline-receipt.json" \
            node --test --test-concurrency=1 test/release-pair-native.test.js \
            2>&1 | tee "$RUNNER_TEMP/legion-pair/logs/paired-native-tests.txt"
      - name: Collect the matching receipt with the original pair tool
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/legion-pair"
          archive="$out/$(node -e \
            'console.log(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))[0].filename)' \
            "$out/npm-pack.json")"
          python -I -B connectors/dsh-plugin-legion/scripts/release_pair.py \
            --core-packager "$GITHUB_WORKSPACE/scripts/package_core.py" \
            --core-repo "$GITHUB_WORKSPACE" --core-commit "$GITHUB_SHA" \
            --core-archive "$out/core.tar" --core-sha256 "$(cat "$out/core.tar.sha256")" \
            --connector-repo "$RUNNER_TEMP/legion-connector" \
            --connector-commit "$(cat "$out/connector-commit.txt")" \
            --connector-source-path connectors/dsh-plugin-legion \
            --connector-archive "$archive" --connector-sha256 "$(cat "$archive.sha256")" \
            --connector-pack-report "$out/npm-pack.json" \
            --evidence "$out/native-offline-receipt.json" --output "$out/pair.with-evidence.json"
      - name: Keep source, package and protocol evidence, not a Release
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legion-source-pair-${{ github.sha }}
          path: ${{ runner.temp }}/legion-pair/
          if-no-files-found: ignore
          retention-days: 7
